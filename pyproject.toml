[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fm-vhgf"
version = "0.1.0"
description = "Volumetric PET/CT classification"
requires-python = ">=3.10"
dependencies = [
  "torch==2.4.1", "numpy==1.26.4", "h5py==3.12.1",
  "scikit-learn==1.5.2", "nibabel==5.3.2", "scipy>=1.11,<2", "safetensors>=0.4.5,<1"
]

[tool.setuptools.packages.find]
include = ["fm_vhgf*"]
